<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Expert English Academy Teachers</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: #fff;
            background:
                radial-gradient(ellipse at top, #103c83 0%, transparent 55%),
                linear-gradient(135deg, #020817, #071b40, #020817);
        }

        .glow {
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: #087cff;
            filter: blur(100px);
            opacity: 0.4;
            animation: glowMove 4s ease-in-out infinite alternate;
        }

        .glow.one {
            top: -90px;
            left: -80px;
        }

        .glow.two {
            bottom: -100px;
            right: -80px;
            background: #00c8ff;
        }

        .welcome-card {
            position: relative;
            width: min(90%, 650px);
            padding: 55px 28px;
            text-align: center;
            border: 1px solid rgba(87, 183, 255, 0.65);
            border-radius: 28px;
            background: rgba(5, 20, 48, 0.78);
            box-shadow:
                0 0 35px rgba(0, 132, 255, 0.25),
                inset 0 0 30px rgba(0, 132, 255, 0.08);
            backdrop-filter: blur(18px);
            animation: cardIn 0.9s ease both;
            z-index: 2;
        }

        .cap {
            font-size: 65px;
            margin-bottom: 18px;
            display: inline-block;
            filter: drop-shadow(0 0 15px #168bff);
            animation: float 2s ease-in-out infinite;
        }

        .welcome-small {
            color: #76caff;
            font-size: 19px;
            letter-spacing: 4px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(29px, 6vw, 47px);
            line-height: 1.2;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #fff, #69caff, #fff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .section-name {
            display: inline-block;
            padding: 10px 28px;
            border: 1px solid #54baff;
            border-radius: 40px;
            color: #fff;
            font-size: 23px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0, 145, 255, 0.22);
            margin-bottom: 20px;
        }

        .tagline {
            color: #d6e8ff;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .progress-track {
            width: 180px;
            height: 4px;
            margin: 0 auto 20px;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.15);
        }

        .progress-bar {
            width: 0;
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #008cff, #70e5ff);
            animation: progress 3s linear forwards;
        }

        .redirect-text {
            color: #9cb9dd;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #70d6ff;
            box-shadow: 0 0 12px #008cff;
            animation: particleFloat 4s linear infinite;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(25px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes glowMove {
            from { transform: scale(0.9); opacity: 0.25; }
            to { transform: scale(1.2); opacity: 0.5; }
        }

        @keyframes progress {
            to { width: 100%; }
        }

        @keyframes particleFloat {
            from { transform: translateY(100vh); opacity: 0; }
            20%, 80% { opacity: 1; }
            to { transform: translateY(-20vh); opacity: 0; }
        }

        @media (max-width: 480px) {
            .welcome-card {
                padding: 42px 20px;
                border-radius: 22px;
            }

            .cap { font-size: 54px; }
            .welcome-small { font-size: 14px; letter-spacing: 3px; }
            .section-name { font-size: 20px; }
            .tagline { font-size: 14px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="glow one"></div>
    <div class="glow two"></div>

    <main class="welcome-card">
        <div class="cap">🎓</div>
        <p class="welcome-small">Welcome to</p>
        <h1>Expert English Academy</h1>
        <div class="section-name">Our Teachers</div>
        <p class="tagline">
            Learn from the Best, Grow for the Future
        </p>

        <div class="progress-track">
            <div class="progress-bar"></div>
        </div>

        <p class="redirect-text">Preparing your experience...</p>
    </main>

    <script>
        for (let i = 0; i < 24; i++) {
            const particle = document.createElement("span");
            particle.className = "particle";
            particle.style.left = Math.random() * 100 + "%";
            particle.style.animationDelay = Math.random() * 4 + "s";
            particle.style.animationDuration = (3 + Math.random() * 4) + "s";
            document.body.appendChild(particle);
        }

        setTimeout(function () {
            window.location.replace("teachers.html");
        }, 3000);
    </script>
</body>
</html>
