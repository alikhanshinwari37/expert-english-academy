<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet Our Founder | Expert English Academy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #fff;
            background:
                radial-gradient(circle at 50% 35%, #164e91 0%, transparent 45%),
                linear-gradient(135deg, #020817, #071a38, #020817);
        }

        .owner-welcome {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            position: relative;
            isolation: isolate;
            text-align: center;
        }

        .glow {
            position: absolute;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: #168bff;
            filter: blur(100px);
            opacity: .3;
            z-index: -1;
            animation: pulse 2s ease-in-out infinite alternate;
        }

        .confetti {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: -1;
        }

        .confetti span {
            position: absolute;
            top: -20px;
            left: var(--x);
            width: 7px;
            height: 13px;
            border-radius: 3px;
            background: var(--color);
            animation: fall var(--duration) linear infinite;
            animation-delay: var(--delay);
        }

        .owner-card {
            width: min(100%, 760px);
            padding: 48px 28px;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 28px;
            background: rgba(255,255,255,.07);
            box-shadow: 0 25px 80px rgba(0,0,0,.4);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            animation: entrance .8s ease both;
        }

        .owner-icon {
            font-size: 54px;
            margin-bottom: 22px;
            animation: float 1.5s ease-in-out infinite;
        }

        .owner-card h1 {
            font-size: clamp(30px, 6vw, 54px);
            line-height: 1.2;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #fff, #83d7ff, #f8d989);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .owner-card p {
            margin-top: 20px;
            color: #d8e8ff;
            font-size: clamp(15px, 2.5vw, 19px);
            line-height: 1.7;
        }

        .journey-line {
            width: 100px;
            height: 3px;
            margin: 28px auto 0;
            border-radius: 10px;
            background: linear-gradient(90deg, #55c7ff, #ffe09a);
            animation: lineGlow 1.2s ease-in-out infinite alternate;
        }

        @keyframes entrance {
            from { opacity: 0; transform: translateY(24px) scale(.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        @keyframes pulse {
            from { transform: scale(.85); opacity: .18; }
            to { transform: scale(1.15); opacity: .35; }
        }

        @keyframes lineGlow {
            from { opacity: .6; transform: scaleX(.8); }
            to { opacity: 1; transform: scaleX(1.15); }
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(600deg); }
        }

        @media (max-width: 480px) {
            .owner-card {
                padding: 40px 20px;
                border-radius: 22px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>
    <main class="owner-welcome">
        <div class="glow"></div>

        <div class="confetti" aria-hidden="true">
            <span style="--x:8%;--color:#58d7ff;--duration:3s;--delay:0s"></span>
            <span style="--x:19%;--color:#ffe09a;--duration:4s;--delay:.5s"></span>
            <span style="--x:32%;--color:#fff;--duration:3.5s;--delay:1s"></span>
            <span style="--x:47%;--color:#58d7ff;--duration:4.2s;--delay:.2s"></span>
            <span style="--x:63%;--color:#ffe09a;--duration:3.2s;--delay:.8s"></span>
            <span style="--x:78%;--color:#fff;--duration:4s;--delay:.3s"></span>
            <span style="--x:91%;--color:#58d7ff;--duration:3.7s;--delay:1.2s"></span>
        </div>

        <section class="owner-card">
            <div class="owner-icon">👑 ✨</div>

            <h1>Meet Our Expert English Academy Owner</h1>

            <p>Discover the Vision Behind Our Academy</p>

            <div class="journey-line"></div>
        </section>
    </main>

    <script>
        window.setTimeout(function () {
            window.location.replace("owner.html");
        }, 3000);
    </script>
</body>
</html>
